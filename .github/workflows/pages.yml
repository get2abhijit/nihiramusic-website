# Publishes the site to GitHub Pages.
# Runs on every change to the default branch (main or master), after each "YouTube sync", and by hand
# (Actions > Deploy site > Run workflow).
# Needs: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: ["YouTube sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No "ref:" on purpose: GitHub checks out the branch that started the run (the default branch for the daily sync).
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
