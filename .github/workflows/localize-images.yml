# Copies every image that still lives on another website (mainly the old Hostinger/zyrosite photos:
# hero, About photo, Concerts banner, logo / share image) into assets/img/, with smaller versions for phones,
# and points data/*.json at the copies (tools/localize_assets.py). Makes Home load faster and keeps the
# photos when the Hostinger plan ends (2028-09-27).
# Run it by hand: Actions > Localize images > Run workflow. Running it again is safe.
# Afterwards "Deploy site" publishes automatically.
# Needs: Settings > Actions > General > Workflow permissions = "Read and write permissions".
name: Localize images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images and rewrite the data files
        run: python3 tools/localize_assets.py
      - name: Check the content files
        run: python3 tools/validate_data.py
      - name: Update share images, preloads and sitemap
        run: python3 tools/build_seo.py
      - name: Commit only if something changed
        run: |
          git add -A data assets/img index.html 404.html '*/index.html' sitemap.xml news/feed.xml
          if git diff --cached --quiet; then
            echo "Nothing to do: all images are already local."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copy external images into assets/img (automatic)"
          git pull --rebase
          git push
