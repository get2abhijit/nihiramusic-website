# Daily: latest videos + video titles + local thumbnails (tools/sync_youtube.py).
# Run it by hand: GitHub > Actions > "YouTube sync" > Run workflow.
# Needs: Settings > Actions > General > Workflow permissions = "Read and write permissions".
# After it finishes, "Deploy site" publishes the result automatically.
name: YouTube sync

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos, titles and thumbnails
        run: python3 tools/sync_youtube.py

      - name: Regenerate SEO files (Home noscript overview lists the latest videos)
        run: python3 tools/build_seo.py

      - name: Commit only if something changed
        run: |
          git add -A data/ assets/img/yt/ sitemap.xml robots.txt news/feed.xml events/calendar.ics index.html 404.html '*/index.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update YouTube videos (automatic)"
          git pull --rebase
          git push
