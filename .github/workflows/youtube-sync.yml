# Updates data/youtube-latest.json from the YouTube channel feed once a day.
# Run it by hand: GitHub > Actions > "YouTube sync" > Run workflow.
# Needs: Settings > Actions > General > Workflow permissions = "Read and write permissions".
name: YouTube sync

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos and fill missing titles
        run: python3 tools/sync_youtube.py --fill-titles

      - name: Commit only if something changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update YouTube videos (automatic)"
          git push
